name: Publish

# Publishes the package to npm when a version tag is pushed (v0.1.0), after
# the same checks as CI and a check of the packed file itself. The steps a
# person takes are in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag names the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:package
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
