name: Publish

# Publishes the package to npm when a version tag is pushed (v0.1.0), after
# the same checks as CI and a check of the packed file itself. No token is
# stored: npm trusts this workflow of this repository (a Trusted Publisher,
# set in the package's settings on npmjs.com) and records where the version
# was built. The steps a person takes are in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag names the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:package
      # Trusted publishing needs npm 11.5.1 or later; Node 22 brings an older one.
      - run: npm install -g npm@latest
      - name: Publish, unless this version is on npm already
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME $VERSION is on npm already; nothing to publish."
          else
            npm publish --access public --ignore-scripts
          fi
